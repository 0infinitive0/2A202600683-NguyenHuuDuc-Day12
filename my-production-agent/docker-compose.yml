version: '3.8'

services:
  agent:
    build: .
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - AGENT_API_KEY=${AGENT_API_KEY:-secret}
    deploy:
      replicas: 3
    depends_on:
      - redis

  redis:
    image: redis:alpine

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent